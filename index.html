<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08090c">
    <title>GTA SA-MP | Modern Speedometer HUD</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#DC2626',
                            redBright: '#EF4444',
                            redDark: '#991B1B',
                            white: '#FFFFFF',
                            silver: '#E2E8F0',
                            black: '#08090C',
                            panel: '#111318'
                        }
                    },
                    fontFamily: {
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            color-scheme: dark;
            --black: #08090c;
            --panel: #111318;
            --panel-soft: rgba(16, 18, 24, .95);
            --red: #dc2626;
            --red-bright: #ef4444;
            --red-glow: rgba(239, 68, 68, .42);
            --white: #ffffff;
            --silver: #f1f5f9;
            --muted: rgba(255, 255, 255, .6);
            --line: rgba(255, 255, 255, .18);
        }

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            overflow: hidden;
            background-color: #08090c;
            color: var(--white);
            font-family: Inter, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body.cef-transparent {
            background: transparent !important;
        }

        body.radial-menu-closed main,
        body.radial-menu-closed .hud-overlay,
        body.radial-menu-closed .hud-grid,
        body.radial-menu-closed #inline-settings-panel {
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        button, [role="button"], .slice-group,
        button *, [role="button"] *, .slice-group * {
            -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
            -webkit-touch-callout: none;
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-user-drag: none;
        }
        button {
            font: inherit;
            -webkit-appearance: none !important;
            appearance: none !important;
            outline: none;
        }
        button:focus, button:focus-visible,
        [role="button"]:focus, [role="button"]:focus-visible,
        .slice-group:focus, .slice-group:focus-visible {
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        html.keyboard-navigation button:focus-visible,
        html.keyboard-navigation [role="button"]:focus-visible,
        html.keyboard-navigation .slice-group:focus-visible {
            outline: 2px solid var(--red-bright) !important;
            outline-offset: 4px;
        }
        ::selection { background: transparent; color: inherit; }

        .hud-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at center, rgba(220, 38, 38, .15) 0%, rgba(255, 255, 255, .04) 26%, rgba(8, 9, 12, .65) 55%, rgba(0, 0, 0, .92) 100%);
        }
        .hud-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .16;
            background-image:
                linear-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(239, 68, 68, .1) 1px, transparent 1px);
            background-size: 36px 36px;
            -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 74%);
            mask-image: radial-gradient(circle at center, black 0%, transparent 74%);
        }
        main {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 14px;
        }

        /* Animasi untuk wadah layout (tidak dipakai pada item yang butuh translate posisi) */
        .menu-enter { animation: menuEnter .24s cubic-bezier(.16, 1, .3, 1) both; }
        @keyframes menuEnter {
            from { opacity: 0; transform: scale(.95); filter: blur(3px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }
        .soft-pulse { animation: softPulse 3s ease-in-out infinite; }
        @keyframes softPulse {
            0%, 100% {
                box-shadow: 0 0 0 2px rgba(255, 255, 255, .75), 0 0 0 5px rgba(220, 38, 38, .28), 0 12px 32px rgba(0, 0, 0, .75);
            }
            50% {
                box-shadow: 0 0 0 2px #ffffff, 0 0 26px rgba(239, 68, 68, .55), 0 12px 32px rgba(0, 0, 0, .85);
            }
        }
        .glow-chrome { filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .72)); }

        /* ==================== 1. CIRCLE LAYOUT ==================== */
        #layout-circle {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(86vmin, 530px);
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
        }
        .circle-outer-ring {
            position: absolute;
            inset: 0.5%;
            border: 1.5px solid rgba(239, 68, 68, .42);
            border-radius: 50%;
            box-shadow: 0 0 38px rgba(220, 38, 38, .18), inset 0 0 24px rgba(255, 255, 255, .05);
            pointer-events: none;
        }
        .circle-outer-ring::before {
            content: '';
            position: absolute;
            inset: 7px;
            border: 1px dashed rgba(255, 255, 255, .24);
            border-radius: 50%;
        }
        .circle-outer-ring::after {
            content: '';
            position: absolute;
            inset: -7px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 50%;
        }
        #circle-menu-svg { width: 100%; height: 100%; overflow: visible; }
        .slice-path {
            fill: rgba(15, 17, 23, .95);
            stroke: rgba(255, 255, 255, .24);
            stroke-width: 1.5;
            transition: fill .18s ease, stroke .18s ease, filter .18s ease;
            cursor: pointer;
        }
        .slice-group:hover .slice-path,
        .slice-group:focus-visible .slice-path {
            fill: url(#merahPutihGradient);
            stroke: #ffffff;
            stroke-width: 2;
            filter: drop-shadow(0 0 16px rgba(239, 68, 68, .55));
        }
        .slice-group:active .slice-path { fill: #b91c1c; }
        .slice-fo { pointer-events: none; }
        .slice-content {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #ffffff;
            text-align: center;
            transition: color .18s ease, transform .18s ease;
        }
        .slice-content i {
            font-size: clamp(16px, 2.7vw, 22px);
            color: #ef4444;
            filter: drop-shadow(0 2px 6px rgba(239, 68, 68, .35));
            transition: color .18s ease, transform .18s ease, filter .18s ease;
        }
        .slice-group:hover .slice-content,
        .slice-group:focus-visible .slice-content {
            color: #ffffff;
            transform: scale(1.06);
        }
        .slice-group:hover .slice-content i,
        .slice-group:focus-visible .slice-content i {
            color: #ffffff;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .4));
        }
        .slice-content span {
            max-width: 100%;
            font-family: Rajdhani, sans-serif;
            font-size: clamp(10px, 1.55vw, 13px);
            font-weight: 800;
            letter-spacing: .09em;
            line-height: 1;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Center Hub Merah Putih */
        .center-hub {
            position: absolute;
            z-index: 30;
            display: flex;
            width: clamp(108px, 30%, 166px);
            aspect-ratio: 1 / 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 0%, rgba(220, 38, 38, .42) 0%, transparent 58%),
                radial-gradient(circle at 50% 100%, rgba(255, 255, 255, .14) 0%, transparent 55%),
                linear-gradient(160deg, #1b1e28 0%, #090a0e 78%);
            color: #fff;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .center-hub:hover {
            transform: scale(1.05);
            border-color: #ffffff;
            box-shadow: 0 0 0 5px rgba(239, 68, 68, .28), 0 0 34px rgba(239, 68, 68, .48);
        }
        .hub-logo-wrap {
            display: flex;
            width: 68%;
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }
        .center-hub-logo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .75));
            pointer-events: none;
        }
        .hub-logo-wrap i { font-size: clamp(22px, 4vw, 29px); color: #ffffff; }
        .hub-title {
            font-family: Rajdhani, sans-serif;
            font-size: clamp(10px, 1.8vw, 14px);
            font-weight: 800;
            letter-spacing: .12em;
            line-height: 1;
            color: #ffffff;
        }
        .hub-hint {
            padding: 3px 9px;
            border: 1px solid rgba(255, 255, 255, .55);
            border-radius: 999px;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: #ffffff;
            font: 800 7.5px/1.1 Inter, sans-serif;
            letter-spacing: .1em;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(220, 38, 38, .45);
        }

        /* ==================== 2. HEXAGON LAYOUT ==================== */
        #layout-hexagon {
            position: relative;
            display: flex;
            width: min(88vmin, 540px);
            aspect-ratio: 1 / 1;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            /* Radius & ukuran node dikendalikan satu variabel agar selalu simetris */
            --hex-radius: 35.2%;
            --hex-node: 19.5%;
        }
        #layout-hexagon.hex-count-5,
        #layout-hexagon.hex-count-6 { --hex-node: 22.5%; }
        #layout-hexagon.hex-count-4 { --hex-node: 25%; }
        #hex-connector-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }
        #hex-nodes-container {
            position: absolute;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
        }
        .hex-node {
            position: absolute;
            z-index: 3;
            display: flex;
            width: var(--hex-node);
            aspect-ratio: 1 / 1;
            align-items: center;
            justify-content: center;
            padding: 2px;
            border: 0;
            background: linear-gradient(150deg, #ef4444 0%, #ffffff 52%, rgba(255, 255, 255, .25) 100%);
            clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
            color: #fff;
            cursor: pointer;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .65));
            transition: transform .18s ease, filter .18s ease, background .18s ease;
            animation: hexNodeEnter .26s cubic-bezier(.16, 1, .3, 1);
        }
        @keyframes hexNodeEnter {
            from { opacity: 0; transform: translate(-50%, -50%) scale(.82); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .hex-node:hover, .hex-node:focus-visible {
            transform: translate(-50%, -50%) scale(1.08);
            background: linear-gradient(150deg, #ffffff 0%, #ef4444 100%);
            filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .7)) drop-shadow(0 0 16px rgba(239, 68, 68, .55));
        }
        .hex-node:active { transform: translate(-50%, -50%) scale(.97); }
        .hex-node-inner {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(3px, 0.8vmin, 5px);
            padding: 4px;
            overflow: hidden;
            clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
            background: linear-gradient(160deg, #191c25, #0a0b10);
            color: #fff;
            transition: background .18s ease, color .18s ease;
        }
        .hex-node:hover .hex-node-inner, .hex-node:focus-visible .hex-node-inner {
            background: linear-gradient(155deg, #dc2626 0%, #991b1b 100%);
            color: #ffffff;
        }
        .hex-node-inner i {
            display: flex;
            width: clamp(20px, 4.4vmin, 30px);
            height: clamp(20px, 4.4vmin, 30px);
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(239, 68, 68, .35);
            border-radius: clamp(6px, 1.2vmin, 9px);
            background: rgba(239, 68, 68, .12);
            color: #ef4444;
            font-size: clamp(11px, 2.2vmin, 16px);
            transition: color .18s ease, background .18s ease, border-color .18s ease;
        }
        .hex-node:hover .hex-node-inner i, .hex-node:focus-visible .hex-node-inner i {
            border-color: rgba(255, 255, 255, .45);
            background: #ffffff;
            color: #dc2626;
        }
        .hex-node-inner span {
            max-width: 100%;
            color: inherit;
            font: 800 clamp(8px, 1.55vmin, 11.5px)/1 Rajdhani, sans-serif;
            letter-spacing: .04em;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Center Hub berbentuk Heksagon agar serasi dengan node sekitarnya */
        .hex-center-hub {
            width: 27%;
            aspect-ratio: 1 / 1;
            border: 0;
            border-radius: 0;
            padding: 2.5px;
            background: linear-gradient(150deg, #ffffff 0%, #ef4444 50%, #ffffff 100%);
            clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
            filter: drop-shadow(0 0 22px rgba(239, 68, 68, .45));
        }
        .hex-center-hub-inner {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
            background:
                radial-gradient(circle at 50% 0%, rgba(220, 38, 38, .48) 0%, transparent 60%),
                linear-gradient(160deg, #1b1e28 0%, #090a0e 82%);
        }
        .hex-center-hub .hub-logo-wrap { width: 54%; }

        /* ==================== 3. FLOATING DOCK LAYOUT ==================== */
        #layout-arc {
            display: flex;
            width: 100%;
            max-width: 980px;
            max-height: 94vh;
            min-width: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2.2vmin, 20px);
            padding-inline: 4px;
        }
        /* Dock = flex row; kartu dinaikkan dengan --lift (kurva parabola), bukan posisi absolut */
        #arc-items-container {
            position: relative;
            display: flex;
            width: 100%;
            max-width: 100%;
            flex-wrap: nowrap;
            align-items: flex-end;
            justify-content: center;
            gap: clamp(6px, 1.1vw, 14px);
            height: auto;
        }
        #arc-items-container:not(.is-compact) {
            padding-top: calc(var(--dock-lift, 0px) + 10px);
        }
        .arc-item {
            position: relative;
            z-index: 3;
            display: flex;
            width: clamp(66px, 8.6vw, 104px);
            min-width: 0;
            height: clamp(78px, 9.9vw, 112px);
            flex: 0 1 auto;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(5px, 1vmin, 8px);
            padding: 8px 4px;
            border: 1px solid rgba(255, 255, 255, .2);
            border-top: 2px solid rgba(239, 68, 68, .75);
            border-radius: clamp(14px, 2vmin, 18px);
            background: linear-gradient(160deg, rgba(24, 27, 36, .96), rgba(10, 11, 16, .98));
            box-shadow: 0 12px 28px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .14);
            color: #fff;
            cursor: pointer;
            transform: translateY(calc(var(--lift, 0px) * -1));
            transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease, color .18s ease;
            animation: dockItemEnter .26s cubic-bezier(.16, 1, .3, 1);
        }
        @keyframes dockItemEnter {
            from { opacity: 0; transform: translateY(calc(var(--lift, 0px) * -1)) scale(.88); }
            to   { opacity: 1; transform: translateY(calc(var(--lift, 0px) * -1)) scale(1); }
        }
        /* Saat window di-resize jangan ulangi animasi masuk */
        body.is-resizing #layout-circle,
        body.is-resizing #layout-hexagon,
        body.is-resizing #layout-arc,
        body.is-resizing .hex-node,
        body.is-resizing .arc-item,
        body.is-resizing .slice-group { animation: none !important; }
        .arc-item:hover, .arc-item:focus-visible {
            z-index: 5;
            transform: translateY(calc(var(--lift, 0px) * -1 - 8px)) scale(1.06);
            border-color: #ffffff;
            background: linear-gradient(155deg, #dc2626 0%, #991b1b 100%);
            color: #ffffff;
            box-shadow: 0 14px 30px rgba(0, 0, 0, .6), 0 0 24px rgba(239, 68, 68, .5);
        }
        .arc-icon {
            display: flex;
            width: clamp(32px, 4.4vmin, 40px);
            height: clamp(32px, 4.4vmin, 40px);
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(239, 68, 68, .35);
            border-radius: clamp(9px, 1.6vmin, 12px);
            background: rgba(239, 68, 68, .12);
            color: #ef4444;
            font-size: clamp(15px, 2.4vmin, 18px);
            transition: all .18s ease;
        }
        .arc-item:hover .arc-icon, .arc-item:focus-visible .arc-icon {
            border-color: #ffffff;
            background: #ffffff;
            color: #dc2626;
        }
        .arc-item-label {
            max-width: 100%;
            font: 800 clamp(10px, 1.9vmin, 12px)/1 Rajdhani, sans-serif;
            letter-spacing: .07em;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Grid simetris rata tengah saat layar compact */
        #arc-items-container.is-compact {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            width: min(100%, 560px);
            margin-inline: auto;
            height: auto;
            min-height: 0;
            padding-top: 0 !important;
            gap: clamp(8px, 1.8vmin, 12px);
        }
        #arc-items-container.is-compact .arc-item {
            flex: 0 0 calc(25% - 9px);
            width: calc(25% - 9px);
            height: clamp(70px, 17vmin, 96px);
            min-width: 0;
            padding: 7px 4px;
            border-radius: 15px;
            transform: none;
        }
        #arc-items-container.is-compact.cols-3 .arc-item {
            flex: 0 0 calc(33.333% - 8px);
            width: calc(33.333% - 8px);
        }
        #arc-items-container.is-compact .arc-item:hover,
        #arc-items-container.is-compact .arc-item:focus-visible { transform: translateY(-2px) scale(1.03); }
        #arc-items-container.is-compact .arc-icon {
            width: clamp(26px, 6.4vmin, 34px);
            height: clamp(26px, 6.4vmin, 34px);
            font-size: clamp(13px, 3.2vmin, 16px);
            border-radius: 10px;
        }
        #arc-items-container.is-compact .arc-item-label { font-size: clamp(9px, 1.6vmin, 12px); }

        .arc-close-button {
            position: relative;
            z-index: 6;
            display: flex;
            flex: 0 0 auto;
            min-height: 52px;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 8px 24px;
            border: 1.5px solid rgba(255, 255, 255, .65);
            border-left: 4px solid #dc2626;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(24, 27, 36, .98), rgba(10, 11, 16, .98));
            color: #fff;
            box-shadow: 0 10px 26px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .15);
            cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
        }
        .arc-close-button:hover {
            transform: translateY(-2px);
            border-color: #ffffff;
            box-shadow: 0 12px 28px rgba(0, 0, 0, .65), 0 0 22px rgba(239, 68, 68, .38);
        }
        .arc-close-button .hub-logo-wrap { width: 42px; height: 42px; flex: 0 0 42px; }
        .arc-close-button .center-hub-logo { width: 100%; height: 100%; }
        .arc-close-button .hub-logo-wrap i { font-size: 20px; color: #ef4444; }
        .arc-close-button .hub-title { font-size: 14px; letter-spacing: .1em; color: #ffffff; }
        .arc-close-button .hub-hint {
            display: inline-block;
            margin-top: 4px;
            border: 0;
            background: transparent;
            color: #fca5a5;
            padding: 0;
            text-align: left;
            box-shadow: none;
        }

        /* ==================== SPEEDOMETER HUD LAYER ==================== */
        #speedo-layer {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            pointer-events: none;
            padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        }
        #speedo-layer.sp-off { display: none !important; }
        #speedo-layer[data-pos="top-left"]     { align-items: flex-start; justify-content: flex-start; }
        #speedo-layer[data-pos="top-center"]   { align-items: flex-start; justify-content: center; }
        #speedo-layer[data-pos="top-right"]    { align-items: flex-start; justify-content: flex-end; }
        #speedo-layer[data-pos="middle-left"]  { align-items: center;     justify-content: flex-start; }
        #speedo-layer[data-pos="middle-center"]{ align-items: center;     justify-content: center; }
        #speedo-layer[data-pos="middle-right"] { align-items: center;     justify-content: flex-end; }
        #speedo-layer[data-pos="bottom-left"]  { align-items: flex-end;   justify-content: flex-start; }
        #speedo-layer[data-pos="bottom-center"]{ align-items: flex-end;   justify-content: center; }
        #speedo-layer[data-pos="bottom-right"] { align-items: flex-end;   justify-content: flex-end; }

        .speedo-variant {
            display: none;
            position: relative;
            flex: 0 0 auto;
            transform: translate(var(--sp-dx, 0px), var(--sp-dy, 0px)) scale(var(--sp-scale, 1));
            transform-origin: center;
        }
        .speedo-variant.is-active { display: block; }
        #speedo-layer.is-dragging .speedo-variant {
            pointer-events: auto;
            cursor: grab;

            outline: 2px dashed rgba(239, 68, 68, .8);
            outline-offset: 10px;
            border-radius: 20px;
        }
        #speedo-layer.is-dragging .speedo-variant:active { cursor: grabbing; }

        @keyframes spEnter {
            from { opacity: 0; transform: translateY(10px) scale(.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes spBlink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

        /* ---------- Variant A : Two-Pod ---------- */
        .twopod {
            --w: clamp(300px, 28vw, 430px);
            --red: #e5092f;
            --red2: #ff405b;
            --muted: #8f96a3;

            aspect-ratio: 480 / 262;
            isolation: isolate;
            animation: spEnter .4s cubic-bezier(.2, .8, .2, 1) both;
        }
        .twopod .cluster-shell {

        }
        .twopod .cluster-shell.shift-halo {
            filter: drop-shadow(0 14px 26px rgba(0, 0, 0, .85)) drop-shadow(0 0 18px rgba(229, 9, 47, .55));
        }
        .twopod .dial { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
        .twopod .arc { fill: none; stroke-linecap: round; transition: stroke-dashoffset .13s cubic-bezier(.2, .8, .2, 1); }
        .twopod .tick { stroke-linecap: round; }
        .twopod .scale-num { font-family: 'Arial Narrow', Arial, sans-serif; font-weight: 800; font-size: 10px; fill: #c8ccd4; text-anchor: middle; }

        .twopod .needle { transform-box: view-box; will-change: transform; }
        .twopod #tp-needleSpeed { transform-origin: 128px 126px; transition: transform .15s cubic-bezier(.18, .75, .22, 1); }
        .twopod #tp-needleRpm { transform-origin: 352px 126px; transition: transform .12s cubic-bezier(.18, .75, .22, 1); }
        .twopod .signal { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s; }
        .twopod .signal.signal-active { stroke: var(--red2); filter: drop-shadow(0 0 5px var(--red)); animation: spBlink .5s infinite; }
        .twopod .readout-value { font-family: 'Arial Narrow', Impact, Arial, sans-serif; font-weight: 900; fill: #fff; text-anchor: middle; font-variant-numeric: tabular-nums; }
        .twopod #tp-speedValue { font-size: 42px; letter-spacing: -1.3px; paint-order: stroke; stroke: #04050a; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
        .twopod .readout-unit { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 9.5px; letter-spacing: .42em; fill: var(--red2); text-anchor: middle; }
        .twopod #tp-gearValue { font-size: 27px; letter-spacing: -.5px; fill: #fff; paint-order: stroke; stroke: rgba(120, 0, 22, .55); stroke-width: 1.6; stroke-linejoin: round; }
        .twopod #tp-rpmValueBox { font-family: 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 10.5px; letter-spacing: .08em; fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; }
        .twopod #tp-rpmValue { fill: #fff; font-weight: 800; }
        .twopod .shift-bar {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: calc(var(--w) * .008);
            padding: calc(var(--w) * .009) calc(var(--w) * .016);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(12, 13, 18, .98), rgba(4, 5, 8, .98));
            border: 1px solid rgba(255, 255, 255, .14);

            z-index: 6;
        }
        .twopod .shift-led {
            width: calc(var(--w) * .0155);
            height: calc(var(--w) * .0095);
            border-radius: 999px;
            background: rgba(255, 255, 255, .11);
            transition: background .08s, box-shadow .08s;
        }
        .twopod .shift-led.on.w { background: #fff; box-shadow: 0 0 6px rgba(255, 255, 255, .9); }
        .twopod .shift-led.on.r { background: var(--red2); box-shadow: 0 0 8px var(--red); }
        .twopod .bottom-deck {
            position: absolute;
            left: 2.5%; right: 2.5%; bottom: 0;
            height: calc(var(--w) * .068);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: calc(var(--w) * .02);
            padding: 0 calc(var(--w) * .028);
            border-radius: calc(var(--w) * .026);
            background: linear-gradient(180deg, rgba(13, 14, 20, .97), rgba(4, 5, 9, .99));

        }
        .twopod .bottom-deck::before {
            content: '';
            position: absolute;
            left: calc(var(--w) * .035); right: calc(var(--w) * .035);
            top: -1px;

            background: linear-gradient(90deg, transparent, rgba(229, 9, 47, .85), transparent);

        }
        .twopod .wing {
            display: flex;
            align-items: center;
            gap: calc(var(--w) * .012);
            min-width: calc(var(--w) * .185);
            padding: calc(var(--w) * .006) calc(var(--w) * .012);
            border-radius: calc(var(--w) * .016);
            background: rgba(255, 255, 255, .035);
            border: 1px solid rgba(255, 255, 255, .09);

        .twopod .wing-icon svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
        .twopod .wing-body { display: flex; flex-direction: column; gap: calc(var(--w) * .005); flex: 1 1 auto; min-width: 0; }
        .twopod .wing-value { font-family: 'Arial Narrow', Arial, sans-serif; font-weight: 800; font-size: calc(var(--w) * .021); line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
        .twopod .bar { display: block; width: 100%; height: calc(var(--w) * .0075); border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; }
        .twopod .bar i { display: block; height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--red2), #ffffff); transition: width .25s cubic-bezier(.2, .8, .2, 1); }
        .twopod .wing.right { flex-direction: row-reverse; text-align: right; }
        .twopod .wing.right .wing-body { align-items: flex-end; }
        .twopod .wing.low { border-color: rgba(229, 9, 47, .6); background: rgba(229, 9, 47, .10); }
        .twopod .wing.low .wing-icon, .twopod .wing.low .wing-value { color: var(--red2); filter: drop-shadow(0 0 5px rgba(229, 9, 47, .8)); }
        .twopod .status-dock {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: calc(var(--w) * .017);
            padding: calc(var(--w) * .007) calc(var(--w) * .018);
            border-radius: calc(var(--w) * .02);
            background: rgba(255, 255, 255, .035);
            border: 1px solid rgba(255, 255, 255, .09);
        }
        .twopod .status-icon { width: calc(var(--w) * .026); height: calc(var(--w) * .026); display: grid; place-items: center; color: rgba(255, 255, 255, .20); transition: color .2s, filter .2s; }
        .twopod .status-icon svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
        .twopod .status-icon.on { color: #fff; filter: drop-shadow(0 0 4px rgba(255, 255, 255, .5)); }
        .twopod .status-icon.warn { color: var(--red2); filter: drop-shadow(0 0 6px var(--red)); animation: spBlink .85s infinite; }

        /* ---------- Variant B : One-Pod ---------- */
        .onepod {
            --size: clamp(150px, 14vw, 180px);
            --red: #e5092f;
            --red2: #ff405b;
            --muted: #9aa0ab;
            position: relative;
            width: var(--size);
            height: var(--size);
            isolation: isolate;
            animation: spEnter .4s cubic-bezier(.2, .8, .2, 1) both;
        }
        .onepod .cluster-housing {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 25%, rgba(22, 23, 28, .96), rgba(6, 6, 9, .98) 76%);
            border: 1px solid rgba(255, 255, 255, .15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .68), inset 0 1px 0 rgba(255, 255, 255, .12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: box-shadow .2s, border-color .2s;
        }
        .onepod .cluster-housing.shift-halo {
            border-color: rgba(229, 9, 47, .9);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .68), 0 0 18px rgba(229, 9, 47, .5), inset 0 0 14px rgba(229, 9, 47, .25);
        }
        .onepod .dial { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
        .onepod .track { fill: none; stroke: rgba(255, 255, 255, .08); stroke-width: 9; stroke-linecap: round; }
        .onepod .track.inner { stroke: rgba(255, 255, 255, .05); stroke-width: 4; }
        .onepod .arc { fill: none; stroke-linecap: round; transition: stroke-dashoffset .14s cubic-bezier(.2, .8, .2, 1); filter: url(#opGlow); }
        .onepod #op-speedArc { stroke: url(#opSpeedGrad); stroke-width: 9; }
        .onepod #op-rpmArc { stroke: var(--red2); stroke-width: 4; opacity: .92; }
        .onepod #op-healthArc, .onepod #op-fuelArc { stroke-width: 5; }
        .onepod .needle-transition { transform-origin: 175px 175px; transition: transform .14s cubic-bezier(.18, .75, .22, 1); will-change: transform; }
        .onepod .center-ui {
            position: absolute;
            inset: 12%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4% 2% 6%;
            text-align: center;
            pointer-events: none;
        }
        .onepod .topline { width: 62%; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
        .onepod .signal { font-size: 8px; color: rgba(255, 255, 255, .18); transition: color .15s, filter .15s; }
        .onepod .signal.signal-active { color: var(--red2); filter: drop-shadow(0 0 5px var(--red)); animation: spBlink .55s infinite; }
        .onepod .gear {
            min-width: 18px;
            padding: 1.5px 6px;
            border-radius: 5px;
            font: 800 9.5px/1.1 'Arial Narrow', Arial, sans-serif;
            letter-spacing: .4px;
            color: #fff;
            background: linear-gradient(145deg, #ff405b, #9e001f);
            border: 1px solid rgba(255, 255, 255, .24);

        }
        .onepod .readout {

            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: auto;
            margin-bottom: 4px;
            padding: 3px 10px 4px;
            border-radius: 10px;
            background: radial-gradient(ellipse at center, rgba(8, 9, 13, .88) 45%, transparent 100%);
        }
        .onepod .speed { font: 900 clamp(23px, 2.3vw, 29px)/.92 'Arial Narrow', Arial, sans-serif; letter-spacing: -.8px; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, .95); font-variant-numeric: tabular-nums; }
        .onepod .unit { font-size: 6.5px; font-weight: 800; letter-spacing: .24em; color: var(--red2); margin-top: 2px; }
        .onepod .rpm-mini { margin-top: 2px; font: 700 7px/1 monospace; color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
        .onepod .rpm-mini b { color: #eef0f5; font-weight: 700; }
        .onepod .status-dock {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 3px 7px;
            border-radius: 16px;
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .1);

        .onepod .status-icon { width: 9.5px; height: 9.5px; display: grid; place-items: center; color: rgba(255, 255, 255, .22); transition: color .2s, filter .2s; }
        .onepod .status-icon svg, .onepod .wing-icon svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
        .onepod .status-icon.on { color: #fff; filter: drop-shadow(0 0 4px rgba(255, 255, 255, .5)); }
        .onepod .status-icon.warn { color: var(--red2); filter: drop-shadow(0 0 5px var(--red)); animation: spBlink .8s infinite; }
        .onepod .wing {
            position: absolute;
            bottom: 2%;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            border-radius: 8px;
            background: rgba(10, 11, 15, .95);
            border: 1px solid rgba(255, 255, 255, .13);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .7);

        }
        .onepod .wing.left { left: 2%; }
        .onepod .wing.right { right: 2%; }
        .onepod .wing-icon { width: 10px; height: 10px; color: var(--red2); flex: 0 0 auto; }
        .onepod .wing-value { font: 800 8px/1 monospace; color: #fff; font-variant-numeric: tabular-nums; }
        .onepod .wing.low .wing-icon, .onepod .wing.low .wing-value { color: var(--red2); filter: drop-shadow(0 0 4px var(--red)); }

        /* ---------- Kontrol speedometer di Settings ---------- */
        .spu-chip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 11px 6px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 13px;
            background: rgba(255, 255, 255, .03);
            color: #fff;
            font: 800 12px/1 Rajdhani, sans-serif;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .18s ease;
        }
        .spu-chip i { color: #ef4444; font-size: 13px; }
        .spu-chip:hover { border-color: rgba(239, 68, 68, .65); transform: translateY(-1px); }
        .spu-chip.active {
            border-color: #ef4444;
            background: linear-gradient(90deg, rgba(220, 38, 38, .28), rgba(255, 255, 255, .07));
            box-shadow: inset 0 0 16px rgba(220, 38, 38, .18);
        }
        .spu-chip.active i { color: #fff; }
        .spu-pos-grid { display: grid; grid-template-columns: repeat(3, 46px); justify-content: center; gap: 8px; }
        .spu-pos {
            display: grid;
            width: 46px;
            height: 46px;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 11px;
            background: rgba(255, 255, 255, .03);
            color: rgba(255, 255, 255, .4);
            cursor: pointer;
            transition: all .18s ease;
        }
        .spu-pos::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .spu-pos:hover { border-color: rgba(239, 68, 68, .6); color: #fff; }
        .spu-pos.active { border-color: #ef4444; background: rgba(220, 38, 38, .22); color: #fff; box-shadow: 0 0 14px rgba(239, 68, 68, .35); }

        /* ==================== SETTINGS MODAL ==================== */
        #inline-settings-panel {
            position: fixed;
            z-index: 50;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, .82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .22s ease;
        }
        #inline-settings-panel.is-open { opacity: 1; pointer-events: auto; }
        .settings-card {
            width: min(460px, calc(100% - 20px));
            max-height: 88vmin;
            overflow-y: auto;
            padding: clamp(18px, 4vw, 26px);
            border: 1px solid rgba(255, 255, 255, .25);
            border-top: 3px solid #dc2626;
            border-radius: 24px;
            background: linear-gradient(155deg, rgba(22, 25, 34, .99), rgba(9, 10, 14, .99));
            box-shadow: 0 24px 70px rgba(0, 0, 0, .8), 0 0 36px rgba(220, 38, 38, .18);
        }
        .settings-title { font: 800 21px/1 Rajdhani, sans-serif; letter-spacing: .08em; color: #ffffff; }
        .shape-option {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 15px;
            background: rgba(255, 255, 255, .03);
            text-align: left;
            cursor: pointer;
            transition: border-color .18s ease, background .18s ease, transform .18s ease;
        }
        .shape-option:hover { transform: translateY(-1px); border-color: rgba(239, 68, 68, .65); }
        .shape-option.active {
            border-color: #ef4444;
            background: linear-gradient(90deg, rgba(220, 38, 38, .22), rgba(255, 255, 255, .06));
            box-shadow: inset 0 0 18px rgba(220, 38, 38, .14);
        }
        .shape-option-title { font: 800 14px/1.1 Rajdhani, sans-serif; color: #fff; }
        .shape-option-desc { margin-top: 4px; font: 500 10px/1.35 Inter, sans-serif; color: rgba(255, 255, 255, .58); }
        .settings-action {
            width: 100%;
            min-height: 46px;
            border: 1px solid #ffffff;
            border-radius: 13px;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: #ffffff;
            font: 800 14px Rajdhani, sans-serif;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(220, 38, 38, .35);
            transition: filter .18s ease, transform .18s ease;
        }
        .settings-action:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .settings-toggle {
            min-width: 66px;
            padding: 7px 14px;
            border: 1px solid #ffffff;
            border-radius: 9px;
            background: #dc2626;
            color: #ffffff;
            font: 800 11px Inter, sans-serif;
            cursor: pointer;
            transition: all .18s ease;
        }
        .settings-toggle.off {
            border-color: rgba(255, 255, 255, .2);
            background: #272b34;
            color: rgba(255, 255, 255, .65);
        }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(239, 68, 68, .55); border-radius: 10px; }

        /* ==================== RESPONSIVE & PORTRAIT HANDLING ==================== */
        @supports (padding: max(0px)) {
            main {
                padding-top: max(8px, env(safe-area-inset-top));
                padding-right: max(8px, env(safe-area-inset-right));
                padding-bottom: max(8px, env(safe-area-inset-bottom));
                padding-left: max(8px, env(safe-area-inset-left));
            }
        }

        @media (orientation: portrait) {
            html, body { overflow: hidden; }
            body {
                position: fixed;
                top: 0;
                left: 100vw;
                width: 100vh;
                height: 100vw;
                max-width: none;
                max-height: none;
                transform: rotate(90deg);
                transform-origin: top left;
            }
            main {
                width: 100%;
                height: 100%;
                min-width: 0;
                min-height: 0;
                padding: 8px;
            }
            .hud-overlay, .hud-grid { position: fixed; inset: 0; }
            #layout-circle, #layout-hexagon { width: min(86vmin, 530px); }
            #layout-arc { max-height: 94vh; }
            .settings-card { max-height: 88vw; }
        }

        @media (max-height: 520px) and (orientation: landscape) {
            #layout-arc { max-height: 96vh; gap: 8px; }
            #arc-items-container.is-compact .arc-item { height: clamp(60px, 17vh, 82px); }
            .settings-card { max-height: 90vh; }
        }

        /* Touch devices: reset hover states after tap */
        @media (hover: none), (pointer: coarse) {
            .slice-group:hover .slice-path {
                fill: rgba(15, 17, 23, .95);
                stroke: rgba(255, 255, 255, .24);
                filter: none;
            }
            .slice-group:hover .slice-content { color: #ffffff; transform: none; }
            .slice-group:hover .slice-content i { color: #ef4444; filter: none; }
            .hex-node:hover {
                transform: translate(-50%, -50%);
                background: linear-gradient(150deg, #ef4444 0%, #ffffff 52%, rgba(255, 255, 255, .25) 100%);
                filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .65));
            }
            .hex-node:hover .hex-node-inner {
                background: linear-gradient(160deg, #191c25, #0a0b10);
                color: #ffffff;
            }
            .hex-node:hover .hex-node-inner i {
                border-color: rgba(239, 68, 68, .35);
                background: rgba(239, 68, 68, .12);
                color: #ef4444;
            }
            .arc-item:hover {
                z-index: 3;
                transform: translateY(calc(var(--lift, 0px) * -1));
                border-color: rgba(255, 255, 255, .2);
                border-top-color: rgba(239, 68, 68, .75);
                background: linear-gradient(160deg, rgba(24, 27, 36, .96), rgba(10, 11, 16, .98));
                color: #ffffff;
                box-shadow: 0 12px 28px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .14);
