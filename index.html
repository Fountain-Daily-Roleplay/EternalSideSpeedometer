<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GTA SA-MP / MTA — Ultra Compact HUD</title>
<style>
:root{
  --red:#e5092f;
  --red2:#ff405b;
  --white:#f7f7f8;
  --muted:#9aa0ab;
  /* Skala ultra-compact untuk PC maupun Mobile */
  --size:clamp(150px, 14vw, 180px);
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:transparent;color:var(--white);
  font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;
  user-select:none;-webkit-user-select:none;
}
body{
  display:flex;align-items:flex-end;justify-content:flex-end;
  padding:max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right));
}

#speedometerContainer{
  position:relative;width:var(--size);height:var(--size);
  flex:0 0 auto;isolation:isolate;
  animation:enter .45s cubic-bezier(.2,.8,.2,1) both;
}

.cluster-housing{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 25%,rgba(22,23,28,.96),rgba(6,6,9,.98) 76%);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 8px 24px rgba(0,0,0,.68),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:box-shadow .2s,border-color .2s;
}
.cluster-housing.shift-halo{
  border-color:rgba(229,9,47,.9);
  box-shadow:0 8px 24px rgba(0,0,0,.68),0 0 18px rgba(229,9,47,.5),inset 0 0 14px rgba(229,9,47,.25);
}

.dial{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9;stroke-linecap:round}
.track.inner{stroke:rgba(255,255,255,.05);stroke-width:4}
.arc{fill:none;stroke-linecap:round;transition:stroke-dashoffset .14s cubic-bezier(.2,.8,.2,1);filter:url(#glow)}
#speedArc{stroke:url(#speedGrad);stroke-width:9}
#rpmArc{stroke:var(--red2);stroke-width:4;opacity:.92}
#healthArc,#fuelArc{stroke-width:5}

/* Poros jarum tepat di titik tengah lingkaran (175, 175) agar rotasi simetris */
.needle-transition{transform-origin:175px 175px;transition:transform .14s cubic-bezier(.18,.75,.22,1);will-change:transform}

.center-ui{
  position:absolute;inset:12%;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:4% 2% 6%;text-align:center;pointer-events:none;
}

.topline{
  width:62%;display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:2;
}
.signal{font-size:8px;color:rgba(255,255,255,.18);transition:color .15s,filter .15s}
.signal.signal-active{color:var(--red2);filter:drop-shadow(0 0 5px var(--red));animation:blink .55s infinite}

.gear{
  min-width:18px;padding:1.5px 6px;border-radius:5px;
  font:800 9.5px/1.1 'Arial Narrow',Arial,sans-serif;letter-spacing:.4px;
  color:#fff;background:linear-gradient(145deg,#ff405b,#9e001f);
  border:1px solid rgba(255,255,255,.24);box-shadow:0 2px 8px rgba(229,9,47,.38);
}

/* Readout digital ditempatkan rapi di area bawah tengah (di bawah poros jarum) */
.readout{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin-top:auto;margin-bottom:4px;
  padding:3px 10px 4px;border-radius:10px;
  background:radial-gradient(ellipse at center,rgba(8,9,13,.88) 45%,transparent 100%);
}
.speed{
  font:900 clamp(23px, 2.3vw, 29px)/.92 'Arial Narrow',Arial,sans-serif;
  letter-spacing:-0.8px;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.95);font-variant-numeric:tabular-nums;
}
.unit{
  font-size:6.5px;font-weight:800;letter-spacing:.24em;
  color:var(--red2);margin-top:2px;
}
.rpm-mini{
  margin-top:2px;font:700 7px/1 monospace;color:var(--muted);
  letter-spacing:.04em;font-variant-numeric:tabular-nums;
}
.rpm-mini b{color:#eef0f5;font-weight:700}

/* Dock status ikon */
.status-dock{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:3px 7px;border-radius:16px;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);
}
.status-icon{
  width:9.5px;height:9.5px;display:grid;place-items:center;
  color:rgba(255,255,255,.22);transition:color .2s,filter .2s;
}
.status-icon svg,.wing-icon svg{
  width:100%;height:100%;display:block;fill:none;stroke:currentColor;
  stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;
}
.status-icon.on{color:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.5))}
.status-icon.warn{color:var(--red2);filter:drop-shadow(0 0 5px var(--red));animation:blink .8s infinite}

/* Pill Health & Fuel minimalis */
.wing{
  position:absolute;bottom:2%;display:flex;align-items:center;gap:4px;
  padding:3px 6px;border-radius:8px;
  background:rgba(10,11,15,.95);border:1px solid rgba(255,255,255,.13);
  box-shadow:0 4px 12px rgba(0,0,0,.7);z-index:3;
}
.wing.left{left:2%}.wing.right{right:2%}
.wing-icon{width:10px;height:10px;color:var(--red2);flex:0 0 auto}
.wing-value{font:800 8px/1 monospace;color:#fff;font-variant-numeric:tabular-nums}
.wing.low .wing-icon,.wing.low .wing-value{color:var(--red2);filter:drop-shadow(0 0 4px var(--red))}

@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

@media (max-width:600px){
  :root{--size:145px}
  body{padding:8px}
  .speed{font-size:21px}
  .unit{font-size:6px}
  .rpm-mini{font-size:6.5px}
  .wing{padding:2.5px 5px;border-radius:7px}
  .wing-value{font-size:7.5px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="speedometerContainer">
  <div id="housingBezel" class="cluster-housing">
    <svg class="dial" viewBox="0 0 350 350" aria-hidden="true">
      <defs>
        <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="60%" stop-color="#ff405b"/>
          <stop offset="100%" stop-color="#9e001f"/>
        </linearGradient>
        <linearGradient id="auxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e5092f"/>
          <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Track & Arcs -->
      <circle class="track" cx="175" cy="175" r="145" stroke-dasharray="911.1" stroke-dashoffset="291"/>
      <circle class="track inner" cx="175" cy="175" r="129" stroke-dasharray="810.5" stroke-dashoffset="259"/>
      <!-- Busur samping tipis untuk Health (kiri) & Fuel (kanan) -->
      <circle class="track" cx="175" cy="175" r="162" stroke-width="5" stroke-dasharray="1017.9" stroke-dashoffset="914" transform="rotate(130 175 175)"/>
      <circle class="track" cx="175" cy="175" r="162" stroke-width="5" stroke-dasharray="1017.9" stroke-dashoffset="914" transform="rotate(230 175 175)"/>

      <circle id="speedArc" class="arc" cx="175" cy="175" r="145" stroke-dasharray="911.1" stroke-dashoffset="911.1"/>
      <circle id="rpmArc" class="arc" cx="175" cy="175" r="129" stroke-dasharray="810.5" stroke-dashoffset="810.5"/>
      <circle id="healthArc" class="arc" cx="175" cy="175" r="162" stroke="url(#auxGrad)" stroke-dasharray="1017.9" stroke-dashoffset="1017.9" transform="rotate(130 175 175)"/>
      <circle id="fuelArc" class="arc" cx="175" cy="175" r="162" stroke="url(#auxGrad)" stroke-dasharray="1017.9" stroke-dashoffset="1017.9" transform="rotate(230 175 175)"/>

      <!-- Ticks minimalis -->
      <g id="ticks" opacity=".68"></g>

      <!-- Jarum utama presisi di pusat (175, 175) dengan penyeimbang belakang -->
      <g id="needleGroup" class="needle-transition" style="transform:rotate(-122deg)">
        <path d="M173.4 192 L174.4 42 L175.6 42 L176.6 192 Z" fill="#ffffff" filter="url(#glow)"/>
        <path d="M174.3 175 L175 48 L175.7 175 Z" fill="#ff405b"/>
        <circle cx="175" cy="175" r="9.5" fill="#0b0c10" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>
        <circle cx="175" cy="175" r="5.5" fill="#e5092f"/>
        <circle cx="175" cy="175" r="2" fill="#ffffff"/>
      </g>
    </svg>

    <div class="center-ui">
      <div class="topline">
        <span id="signalLeft" class="signal">◀</span>
        <span id="gearDisplay" class="gear">P</span>
        <span id="signalRight" class="signal">▶</span>
      </div>

      <div class="readout">
        <span id="speedValue" class="speed">0</span>
        <span class="unit">KM/H</span>
        <span class="rpm-mini"><b id="rpmValue">800</b> RPM</span>
      </div>

      <div class="status-dock" aria-label="Vehicle status">
        <span id="iconEngine" class="status-icon" title="Engine">
          <svg viewBox="0 0 24 24"><path d="M5 9h3l2-3h5l2 3h2a2 2 0 0 1 2 2v6h-3v2H8v-2H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2Z"/><path d="M10 6V4h4M3 12H1m22 0h-2"/></svg>
        </span>
        <span id="iconLights" class="status-icon" title="Lights">
          <svg viewBox="0 0 24 24"><path d="M12 4a7 7 0 0 0 0 14V4Z"/><path d="M16 7h5M17 12h5M16 17h5"/></svg>
        </span>
        <span id="iconSeatbelt" class="status-icon warn" title="Seatbelt">
          <svg viewBox="0 0 24 24"><path d="m7 3 4 5-3 3-4-5M14 9l3-3 3 3-4 4"/><path d="m8 12 8 8M5 19l4-4m6-6 3-3"/></svg>
        </span>
        <span id="iconLock" class="status-icon" title="Lock">
          <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg>
        </span>
        <span id="iconHandbrake" class="status-icon warn" title="Handbrake">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 17V7h3a3 3 0 0 1 0 6h-3"/></svg>
        </span>
      </div>
    </div>

    <div id="healthBadge" class="wing left" title="Vehicle Health">
      <span class="wing-icon"><svg viewBox="0 0 24 24"><path d="M12 2.8 20 6v5.2c0 4.7-3.2 8-8 10-4.8-2-8-5.3-8-10V6l8-3.2Z"/><path d="M12 7v9M7.5 11.5h9"/></svg></span>
      <span id="healthText" class="wing-value">100%</span>
    </div>

    <div id="fuelBadge" class="wing right" title="Fuel">
      <span id="fuelText" class="wing-value">85%</span>
      <span class="wing-icon"><svg viewBox="0 0 24 24"><path d="M5 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M4 21h13M8 7h5v5H8z"/><path d="M16 8h2l2 3v6a2 2 0 0 1-4 0v-4"/></svg></span>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const state={speed:0,rpm:800,gear:'P',fuel:85,health:100,engine:false,lights:false,seatbelt:false,locked:false,handbrake:true,signalLeft:false,signalRight:false};
  const MAX_SPEED=300,MAX_RPM=8000;
  const C={speed:911.1,rpm:810.5,aux:1017.9};
  const $=id=>document.getElementById(id);
  const el={
    housing:$('housingBezel'),speed:$('speedValue'),speedArc:$('speedArc'),rpm:$('rpmValue'),rpmArc:$('rpmArc'),
    gear:$('gearDisplay'),needle:$('needleGroup'),fuelArc:$('fuelArc'),fuelText:$('fuelText'),
    healthArc:$('healthArc'),healthText:$('healthText'),healthBadge:$('healthBadge'),fuelBadge:$('fuelBadge'),
    engine:$('iconEngine'),lights:$('iconLights'),belt:$('iconSeatbelt'),lock:$('iconLock'),brake:$('iconHandbrake'),
    left:$('signalLeft'),right:$('signalRight')
  };

  // Ticks minimalis
  const ticks=$('ticks');
  for(let i=0;i<=12;i++){
    const a=(-122+i*(244/12))*Math.PI/180,major=i%2===0;
    const r1=major?135:139,r2=145;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',175+Math.cos(a)*r1);
    line.setAttribute('y1',175+Math.sin(a)*r1);
    line.setAttribute('x2',175+Math.cos(a)*r2);
    line.setAttribute('y2',175+Math.sin(a)*r2);
    line.setAttribute('stroke',i>=10?'#ff405b':(major?'#ffffff':'#7d808a'));
    line.setAttribute('stroke-width',major?2.6:1.4);
    line.setAttribute('stroke-linecap','round');
    ticks.appendChild(line);
  }

  const clamp=(v,min,max)=>Math.min(Math.max(Number(v)||0,min),max);
  const setStatus=(node,on,warn=false)=>{node.className='status-icon'+(warn?' warn':on?' on':'');};

  function render(){
    const speed=clamp(state.speed,0,MAX_SPEED),rpm=clamp(state.rpm,0,MAX_RPM);
    const fuel=clamp(state.fuel,0,100),health=clamp(state.health,0,100);

    el.speed.textContent=Math.round(speed);
    el.speedArc.style.strokeDashoffset=C.speed-(speed/MAX_SPEED*620);
    el.needle.style.transform=`rotate(${-122+(speed/MAX_SPEED*244)}deg)`;

    el.rpm.textContent=Math.round(rpm);
    el.rpmArc.style.strokeDashoffset=C.rpm-(rpm/MAX_RPM*551);
    el.housing.classList.toggle('shift-halo',rpm>=7000);

    if(state.engine){
      if(state.handbrake&&speed===0)state.gear='P';
      else if(state.gear!=='R'&&state.gear!=='N')state.gear=speed<35?'1':speed<70?'2':speed<120?'3':speed<170?'4':speed<230?'5':'6';
    }else state.gear='P';
    el.gear.textContent=String(state.gear??'P').slice(0,3);

    el.healthText.textContent=Math.round(health)+'%';
    el.healthArc.style.strokeDashoffset=C.aux-(health/100*104);
    el.healthBadge.classList.toggle('low',health<=30);

    el.fuelText.textContent=Math.round(fuel)+'%';
    el.fuelArc.style.strokeDashoffset=C.aux-(fuel/100*104);
    el.fuelBadge.classList.toggle('low',fuel<=15);

    setStatus(el.engine,state.engine);
    setStatus(el.lights,state.lights);
    setStatus(el.belt,state.seatbelt,!state.seatbelt);
    setStatus(el.lock,state.locked);
    setStatus(el.brake,state.handbrake,state.handbrake);
    el.left.classList.toggle('signal-active',!!state.signalLeft);
    el.right.classList.toggle('signal-active',!!state.signalRight);
  }

  window.updateSpeedometer=function(data){
    if(!data||typeof data!=='object')return;
    const allowed=['speed','rpm','gear','fuel','health','engine','lights','seatbelt','locked','handbrake','signalLeft','signalRight'];
    for(const key of allowed)if(Object.prototype.hasOwnProperty.call(data,key))state[key]=data[key];
    render();
  };

  const preview=new URLSearchParams(location.search).get('preview')!=='0';
  if(preview)window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k==='arrowup'){state.engine=true;state.handbrake=false;state.speed=clamp(state.speed+4,0,MAX_SPEED);state.rpm=clamp(1200+(state.speed%50)*150,0,MAX_RPM);}
    else if(k==='arrowdown'){state.speed=clamp(state.speed-6,0,MAX_SPEED);state.rpm=clamp(state.rpm-200,800,MAX_RPM);}
    else if(k==='e')state.engine=!state.engine;else if(k==='l')state.lights=!state.lights;
    else if(k==='b')state.seatbelt=!state.seatbelt;else if(k==='k')state.locked=!state.locked;
    else if(k==='h')state.handbrake=!state.handbrake;
    else if(k==='arrowleft'){state.signalLeft=!state.signalLeft;state.signalRight=false;}
    else if(k==='arrowright'){state.signalRight=!state.signalRight;state.signalLeft=false;}
    else return;
    render();
  });
  render();
})();
</script>
</body>
</html>
