                <div class="mb-2 mt-4 text-[10px] font-extrabold tracking-[.16em] text-white/50">POSISI HUD</div>
                <div class="spu-pos-grid" id="spu-pos-grid">
                    <button type="button" class="spu-pos" data-pos="top-left" onclick="setSpeedoPosition('top-left')" aria-label="Kiri atas"></button>
                    <button type="button" class="spu-pos" data-pos="top-center" onclick="setSpeedoPosition('top-center')" aria-label="Tengah atas"></button>
                    <button type="button" class="spu-pos" data-pos="top-right" onclick="setSpeedoPosition('top-right')" aria-label="Kanan atas"></button>
                    <button type="button" class="spu-pos" data-pos="middle-left" onclick="setSpeedoPosition('middle-left')" aria-label="Kiri tengah"></button>
                    <button type="button" class="spu-pos" data-pos="middle-center" onclick="setSpeedoPosition('middle-center')" aria-label="Tengah"></button>
                    <button type="button" class="spu-pos" data-pos="middle-right" onclick="setSpeedoPosition('middle-right')" aria-label="Kanan tengah"></button>
                    <button type="button" class="spu-pos" data-pos="bottom-left" onclick="setSpeedoPosition('bottom-left')" aria-label="Kiri bawah"></button>
                    <button type="button" class="spu-pos" data-pos="bottom-center" onclick="setSpeedoPosition('bottom-center')" aria-label="Tengah bawah"></button>
                    <button type="button" class="spu-pos" data-pos="bottom-right" onclick="setSpeedoPosition('bottom-right')" aria-label="Kanan bawah"></button>
                </div>
                <div class="mb-2 mt-4 flex items-center justify-between text-[10px] font-extrabold tracking-[.16em] text-white/50">
                    <span>UKURAN HUD</span><output id="speedo-size-value">100%</output>
                </div>
                <input id="speedo-size" type="range" min="60" max="140" step="5" value="100" oninput="setSpeedoScale(this.value / 100)" class="w-full accent-red-500" aria-label="Ukuran speedometer">                <div class="mt-3 flex items-center justify-between gap-3">
                    <span class="text-[10px] font-medium leading-tight text-white/45">Aktifkan GESER lalu tarik HUD untuk mengatur posisi bebas.</span>
                    <button type="button" onclick="resetSpeedoOffset()" class="settings-toggle off px-3">RESET</button>
                </div>
            </div>

            <div class="mt-5 flex items-center justify-between border-t border-white/15 pt-4">
                <span class="font-rajdhani text-sm font-bold tracking-wide text-white">SOUND EFFECT</span>
                <button type="button" onclick="toggleAudio()" id="btn-audio-toggle" class="settings-toggle">ON</button>
            </div>
            <button type="button" onclick="closeSettingsModal()" class="settings-action mt-5">SIMPAN &amp; KEMBALI</button>
        </div>
    </div>
    <script>
        const menuItems = [
            { id: 'phone',     title: 'Phone',     icon: 'fa-mobile-screen-button', cmd: '/phone' },
            { id: 'inventory', title: 'Inventory', icon: 'fa-boxes-stacked',         cmd: '/inventory' },
            { id: 'vehicles',  title: 'Vehicles',  icon: 'fa-car-side',              action: 'open-vehicles' },
            { id: 'house',     title: 'House',     icon: 'fa-house-chimney',         cmd: '/house' },
            { id: 'eprop',     title: 'Eprop',     icon: 'fa-building',              cmd: '/prop' },
            { id: 'faction',   title: 'Faction',   icon: 'fa-shield-halved',         cmd: '/f' },
            { id: 'toys',      title: 'Toys',      icon: 'fa-gamepad',               cmd: '/toys' },
            { id: 'settings',  title: 'Settings',  icon: 'fa-gear',                  cmd: 'SETTING_ACTION' }
        ];

        const vehicleItems = [
            { id: 'engine', title: 'Engine',  icon: 'fa-key',         cmd: '/engine' },
            { id: 'lights', title: 'Lampu',   icon: 'fa-lightbulb',   cmd: '/lights' },
            { id: 'trunk',  title: 'Trunk',   icon: 'fa-box-open',    cmd: '/trunk' },
            { id: 'lock',   title: 'Lock',    icon: 'fa-lock',        cmd: '/lock' },
            { id: 'hood',   title: 'Hood',    icon: 'fa-car',         cmd: '/hood' },
            { id: 'back',   title: 'Kembali', icon: 'fa-arrow-left',  action: 'back' }
        ];

        const LOGO_ASSET_PATH = 'assets/logo.png';
        let currentShape = 'circle';
        let currentMenu = 'main';
        let soundEnabled = true;
        let audioCtx = null;
        let radialClosed = false;

        if (window.cef || window.mp) {
            document.body.classList.add('cef-transparent');
        }

        function getActiveItems() {
            return currentMenu === 'vehicles' ? vehicleItems : menuItems;
        }

        function getLogicalViewport() {
            const width = document.documentElement.clientWidth || window.innerWidth || 1;
            const height = document.documentElement.clientHeight || window.innerHeight || 1;
            return width >= height
                ? { width, height }
                : { width: height, height: width };
        }

        function renderAllMenus() {
            renderCircleMenu();
            renderHexagonMenu();
            renderArcMenu();
            updateCenterHub();
            updateShapeVisibility();
        }

        function initializeCenterLogos() {
            document.querySelectorAll('.center-hub-logo').forEach(img => {
                const showFallback = () => {
                    img.dataset.failed = 'true';
                    img.classList.add('hidden');
                    const fallback = img.parentElement.querySelector('i');
                    if (fallback) fallback.classList.remove('hidden');
                };
                img.addEventListener('error', showFallback, { once: true });
                img.src = LOGO_ASSET_PATH;
                if (img.complete && img.naturalWidth === 0) showFallback();
            });
        }

        function updateCenterHub() {
            const isSubmenu = currentMenu === 'vehicles';
            const title = isSubmenu ? 'BACK' : 'CLOSE';
            const hint = isSubmenu ? 'KEMBALI' : 'CLOSE';
            const icon = isSubmenu ? 'fa-arrow-left' : 'fa-xmark';
            const hubs = [
                { title: 'center-hub-title', icon: 'center-hub-icon-circle', hint: 'center-hub-hint-circle', logo: 'center-hub-logo-circle', arc: false },
                { title: 'center-hub-title-hexagon', icon: 'center-hub-icon-hexagon', hint: 'center-hub-hint-hexagon', logo: 'center-hub-logo-hexagon', arc: false },
                { title: 'center-hub-title-arc', icon: 'center-hub-icon-arc', hint: 'center-hub-hint-arc', logo: 'center-hub-logo-arc', arc: true }
            ];
            hubs.forEach(hub => {
                const titleNode = document.getElementById(hub.title);
                const iconNode = document.getElementById(hub.icon);
                const hintNode = document.getElementById(hub.hint);
                const logoNode = document.getElementById(hub.logo);
                const hasLogo = logoNode && logoNode.dataset.failed !== 'true';
                if (titleNode) titleNode.textContent = isSubmenu ? (hub.arc ? 'BACK TO MENU' : title) : (hub.arc ? 'CLOSE MENU' : title);
                if (hintNode) hintNode.textContent = hub.arc ? (isSubmenu ? 'KEMBALI KE MENU' : 'TEKAN [ESC]') : hint;
                if (logoNode) logoNode.classList.toggle('hidden', isSubmenu || !hasLogo);
                if (iconNode) {
                    iconNode.className = `fa-solid ${isSubmenu ? icon : 'fa-xmark'}`;
                    iconNode.classList.toggle('hidden', !isSubmenu && hasLogo);
                }
            });
        }

        function showMainMenu() {
            currentMenu = 'main';
            playSound('select');
            renderAllMenus();
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'hover') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(480, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + .04);
                    gain.gain.setValueAtTime(.02, now);
                    gain.gain.exponentialRampToValueAtTime(.001, now + .045);
                    osc.start(now);
                    osc.stop(now + .045);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(560, now);
                    osc.frequency.exponentialRampToValueAtTime(1020, now + .08);
                    gain.gain.setValueAtTime(.065, now);
                    gain.gain.exponentialRampToValueAtTime(.001, now + .085);
                    osc.start(now);
                    osc.stop(now + .085);
                }
            } catch (error) {
                console.warn('Audio FX unavailable:', error);
            }
        }

        function emitClientEvent(eventName, ...args) {
            if (window.cef && typeof window.cef.emit === 'function') {
                try {
                    window.cef.emit(eventName, ...args);
                    return true;
                } catch (error) {
                    console.warn(`[RadialMenu] cef.emit failed for "${eventName}":`, error);
                    return false;
                }
            }

            if (window.mp && typeof window.mp.trigger === 'function') {
                try {
                    window.mp.trigger(eventName, ...args);
                    return true;
                } catch (error) {
                    console.warn(`[RadialMenu] mp.trigger failed for "${eventName}":`, error);
                    return false;
                }
            }

            console.info(`[RadialMenu] Native bridge not found; local fallback used for "${eventName}".`);
            return false;
        }

        function emitRadialCommand(command) {
            return emitClientEvent('selectRadialItem', command);
        }

        function executeCommand(item) {
            if (!item || radialClosed) return;
            playSound('select');
            if (item.action === 'open-vehicles') {
                currentMenu = 'vehicles';
                renderAllMenus();
                return;
            }
            if (item.action === 'back') {
                showMainMenu();
                return;
            }
            if (item.cmd === 'SETTING_ACTION') {
                openSettingsModal();
                return;
            }
            if (item.cmd) {
                const dispatched = emitRadialCommand(item.cmd);
                if (!dispatched) {
                    console.warn(`[RadialMenu] Command "${item.cmd}" was not dispatched; menu remains open.`);
                }
                return dispatched;
            }
            return false;
        }

        function bindMenuItemClick(element, item) {
            element.addEventListener('click', event => {
                event.preventDefault();
                event.stopPropagation();
                const touchActivation = document.documentElement.classList.contains('touch-input');
                if ((event.detail !== 0 || touchActivation) && element) {
                    if (typeof element.blur === 'function') element.blur();
                    const active = document.activeElement;
                    if (active && active !== document.body && typeof active.blur === 'function') active.blur();
                }
                executeCommand(item);
            });
        }

        function handleCenterClick() {
            if (radialClosed) return;
            if (currentMenu === 'vehicles') {
                showMainMenu();
                return;
            }
            playSound('select');
            closeRadialMenu();
        }

        function closeRadialMenu() {
            if (radialClosed) return false;
            radialClosed = true;
            currentMenu = 'main';

            const settingsPanel = document.getElementById('inline-settings-panel');
            if (settingsPanel) {
                settingsPanel.classList.remove('is-open');
                settingsPanel.setAttribute('aria-hidden', 'true');
            }

            document.body.classList.add('radial-menu-closed');
            return emitClientEvent('closeRadialMenu');
        }

        function openRadialMenu() {
            radialClosed = false;
            currentMenu = 'main';
            document.body.classList.remove('radial-menu-closed');
            closeSettingsModal();
            renderAllMenus();
        }

        window.RadialMenu = window.RadialMenu || {};
        window.RadialMenu.open = openRadialMenu;
        window.RadialMenu.close = closeRadialMenu;
        window.openRadialMenu = openRadialMenu;
        window.closeRadialMenu = closeRadialMenu;        if (window.cef && typeof window.cef.on === 'function') {
            try {
                window.cef.on('radial_open', () => openRadialMenu());
            } catch (error) {
                console.warn('[RadialMenu] radial_open listener unavailable:', error);
            }
        }


        function createArcPath(x, y, innerRadius, outerRadius, startAngle, endAngle) {
            const startRad = startAngle * Math.PI / 180;
            const endRad = endAngle * Math.PI / 180;
            const x1 = x + outerRadius * Math.cos(startRad);
            const y1 = y + outerRadius * Math.sin(startRad);
            const x2 = x + outerRadius * Math.cos(endRad);
            const y2 = y + outerRadius * Math.sin(endRad);
            const x3 = x + innerRadius * Math.cos(endRad);
            const y3 = y + innerRadius * Math.sin(endRad);
            const x4 = x + innerRadius * Math.cos(startRad);
            const y4 = y + innerRadius * Math.sin(startRad);
            const largeArcFlag = endAngle - startAngle <= 180 ? 0 : 1;
            return [
                `M ${x1} ${y1}`,
                `A ${outerRadius} ${outerRadius} 0 ${largeArcFlag} 1 ${x2} ${y2}`,
                `L ${x3} ${y3}`,
                `A ${innerRadius} ${innerRadius} 0 ${largeArcFlag} 0 ${x4} ${y4}`,
                'Z'
            ].join(' ');
        }

        function makeKeyboardAccessible(element, item) {
            element.setAttribute('role', 'button');
            element.setAttribute('tabindex', '0');
            element.setAttribute('aria-label', item.title);
            element.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    executeCommand(item);
                }
            });
        }

        function renderCircleMenu() {
            const group = document.getElementById('circle-slices-group');
            group.innerHTML = '';
            const items = getActiveItems();
            const total = items.length;
            const outerRadius = 246;
            const innerRadius = 122;
            const gapAngle = total >= 8 ? 2.6 : 3.4;
            const textRadius = (innerRadius + outerRadius) / 2;

            items.forEach((item, index) => {
                const sliceAngle = 360 / total;
                const startAngle = index * sliceAngle - 90 + gapAngle / 2;
                const endAngle = (index + 1) * sliceAngle - 90 - gapAngle / 2;
                const midAngle = ((startAngle + endAngle) / 2) * Math.PI / 180;
                const textX = Math.cos(midAngle) * textRadius;
                const textY = Math.sin(midAngle) * textRadius;

                const groupNode = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                groupNode.setAttribute('class', 'slice-group menu-enter');
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', createArcPath(0, 0, innerRadius, outerRadius, startAngle, endAngle));
                path.setAttribute('class', 'slice-path');

                const foreign = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
                foreign.setAttribute('x', textX - 50);
                foreign.setAttribute('y', textY - 34);
                foreign.setAttribute('width', '100');
                foreign.setAttribute('height', '68');
                foreign.setAttribute('class', 'slice-fo');
                const labelSize = item.title.length > 8 ? '10.5px' : '12px';
                foreign.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" class="slice-content"><i class="fa-solid ${item.icon}"></i><span style="font-size:${labelSize}">${item.title}</span></div>`;

                groupNode.appendChild(path);
                groupNode.appendChild(foreign);
                groupNode.addEventListener('mouseenter', () => playSound('hover'));
                bindMenuItemClick(groupNode, item);
                makeKeyboardAccessible(groupNode, item);
                group.appendChild(groupNode);
            });
        }

        /* ==================== HEXAGON POSITIONING ==================== */
        // Ukuran node per jumlah item agar cincin heksagon tetap simetris & tidak bertumpuk
        const HEX_NODE_PERCENT = { 4: 25, 5: 22.5, 6: 22.5, 8: 19.5 };

        function renderHexagonMenu() {
            const layout = document.getElementById('layout-hexagon');
            const container = document.getElementById('hex-nodes-container');
            const linesGroup = document.getElementById('hex-connector-lines');
            const outerPoly = document.getElementById('hex-outer-polygon');
            container.innerHTML = '';
            linesGroup.innerHTML = '';

            const items = getActiveItems();
            const total = items.length;
            const nodePercent = HEX_NODE_PERCENT[total] || 19.5;

            layout.classList.remove('hex-count-4', 'hex-count-5', 'hex-count-6');
            if ([4, 5, 6].includes(total)) layout.classList.add(`hex-count-${total}`);

            // Geometri SVG 540x540 -> persentase agar CSS & garis konektor selalu sejajar
            const svgCenter = 270;
            const svgRadius = 190;
            const radiusPercent = (svgRadius / 540) * 100;
            const nodeUnits = (nodePercent / 100) * 540;
            const hubEdge = 80;
            const lineEnd = Math.max(hubEdge + 18, svgRadius - nodeUnits / 2 - 6);
            const polyPoints = [];

            items.forEach((item, index) => {
                const angleDeg = index * (360 / total) - 90;
                const angle = angleDeg * Math.PI / 180;
                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);

                const svgX = svgCenter + cosA * svgRadius;
                const svgY = svgCenter + sinA * svgRadius;
                polyPoints.push(`${svgX.toFixed(1)},${svgY.toFixed(1)}`);

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', (svgCenter + cosA * hubEdge).toFixed(1));
                line.setAttribute('y1', (svgCenter + sinA * hubEdge).toFixed(1));
                line.setAttribute('x2', (svgCenter + cosA * lineEnd).toFixed(1));
                line.setAttribute('y2', (svgCenter + sinA * lineEnd).toFixed(1));
                line.setAttribute('stroke', 'url(#lineGradient)');
                line.setAttribute('stroke-width', '2');
                line.setAttribute('stroke-dasharray', '4 6');
                line.setAttribute('opacity', '.9');
                linesGroup.appendChild(line);

                const node = document.createElement('button');
                node.type = 'button';
                node.className = 'hex-node';
                node.style.left = `${(50 + cosA * radiusPercent).toFixed(3)}%`;
                node.style.top = `${(50 + sinA * radiusPercent).toFixed(3)}%`;
                node.innerHTML = `<span class="hex-node-inner"><i class="fa-solid ${item.icon}" aria-hidden="true"></i><span>${item.title}</span></span>`;
                node.addEventListener('mouseenter', () => playSound('hover'));
                bindMenuItemClick(node, item);
                node.setAttribute('aria-label', item.title);
                container.appendChild(node);
            });

            if (outerPoly) {
                outerPoly.setAttribute('points', polyPoints.join(' '));
            }
        }

        /* ==================== FLOATING DOCK (FLEX + KURVA) ==================== */
        function getDockLift(index, total, maxLift) {
            if (total < 3 || maxLift <= 0) return 0;
            const t = (index / (total - 1)) * 2 - 1;
            return maxLift * (1 - t * t);
        }

        function renderArcMenu() {
            const container = document.getElementById('arc-items-container');
            container.innerHTML = '';

            const items = getActiveItems();
            const total = items.length;
            const viewport = getLogicalViewport();
            const compact = viewport.width <= 760 || (viewport.height <= 540 && viewport.width <= 1200);

            container.classList.toggle('is-compact', compact);
            container.classList.toggle('cols-3', compact && total === 6);

            const maxLift = compact ? 0 : Math.round(Math.min(44, Math.max(16, viewport.height * 0.055)));
            container.style.setProperty('--dock-lift', `${maxLift}px`);

            items.forEach((item, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'arc-item';
                button.style.setProperty('--lift', `${getDockLift(index, total, maxLift).toFixed(1)}px`);
                button.innerHTML = `<span class="arc-icon"><i class="fa-solid ${item.icon}"></i></span><span class="arc-item-label">${item.title}</span>`;
                button.addEventListener('mouseenter', () => playSound('hover'));
                bindMenuItemClick(button, item);
                button.setAttribute('aria-label', item.title);
                container.appendChild(button);
            });
        }

        function selectShape(shape) {
            if (!['circle', 'hexagon', 'arc'].includes(shape)) return;
            currentShape = shape;
            playSound('select');
            updateShapeVisibility();
            updateSettingsUI();
            if (shape === 'arc') renderArcMenu();
            if (shape === 'hexagon') renderHexagonMenu();
        }

        function updateShapeVisibility() {
            const layouts = {
                circle: document.getElementById('layout-circle'),
                hexagon: document.getElementById('layout-hexagon'),
                arc: document.getElementById('layout-arc')
            };
            Object.entries(layouts).forEach(([shape, element]) => {
                element.classList.toggle('hidden', shape !== currentShape);
                if (shape === currentShape) {
                    element.classList.remove('menu-enter');
                    void element.offsetWidth;
                    element.classList.add('menu-enter');
                }
            });
        }

        function updateSettingsUI() {
            ['circle', 'hexagon', 'arc'].forEach(shape => {
                const option = document.getElementById(`opt-shape-${shape}`);
                const indicator = option.querySelector('.status-indicator');
                option.classList.toggle('active', shape === currentShape);
                indicator.classList.toggle('hidden', shape !== currentShape);
            });
        }

        function openSettingsModal() {
            const modal = document.getElementById('inline-settings-panel');
            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
            updateSettingsUI();
        }

        function closeSettingsModal() {
            const modal = document.getElementById('inline-settings-panel');
            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const button = document.getElementById('btn-audio-toggle');
            button.textContent = soundEnabled ? 'ON' : 'OFF';
            button.classList.toggle('off', !soundEnabled);
            if (soundEnabled) playSound('select');
        }

        function setupInputModality() {
            const root = document.documentElement;
            const setTouchMode = () => {
                root.classList.add('touch-input');
                root.classList.remove('keyboard-navigation');
            };
            const setPointerMode = () => {
                root.classList.remove('touch-input', 'keyboard-navigation');
            };
            const setKeyboardMode = event => {
                if (['Tab', 'Enter', ' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                    root.classList.add('keyboard-navigation');
                    root.classList.remove('touch-input');
                }
            };

            if (window.PointerEvent) {
                document.addEventListener('pointerdown', event => {
                    if (event.pointerType === 'touch' || event.pointerType === 'pen') setTouchMode();
                    else if (event.pointerType === 'mouse') setPointerMode();
                }, true);
            }
            document.addEventListener('touchstart', setTouchMode, { passive: true, capture: true });
            document.addEventListener('mousedown', setPointerMode, true);
            document.addEventListener('keydown', setKeyboardMode, true);
        }

        function setupKeyListeners() {
            window.addEventListener('keydown', event => {
                if (radialClosed) return;
                const modal = document.getElementById('inline-settings-panel');
                const modalOpen = modal && modal.classList.contains('is-open');
                if (event.key === 'Escape') {
                    event.preventDefault();
                    event.stopPropagation();
                    if (modalOpen) closeSettingsModal();
                    else handleCenterClick();
                    return;
                }
                if (modalOpen) return;
                if (event.key === 'Tab') {
                    event.preventDefault();
                    const shapes = ['circle', 'hexagon', 'arc'];
                    selectShape(shapes[(shapes.indexOf(currentShape) + 1) % shapes.length]);
                    return;
                }
                if (/^[1-9]$/.test(event.key)) {
                    const item = getActiveItems()[Number(event.key) - 1];
                    if (item) executeCommand(item);
                }
            });
        }

        initializeCenterLogos();
        setupInputModality();
        renderAllMenus();
        setupKeyListeners();

        let resizeFrame = null;
        function refreshResponsiveMenus() {
            if (resizeFrame) cancelAnimationFrame(resizeFrame);
            document.body.classList.add('is-resizing');
            resizeFrame = requestAnimationFrame(() => {
                renderAllMenus();
                requestAnimationFrame(() => document.body.classList.remove('is-resizing'));
                resizeFrame = null;
            });
        }
        window.addEventListener('resize', refreshResponsiveMenus, { passive: true });
        window.addEventListener('orientationchange', refreshResponsiveMenus, { passive: true });
        window.addEventListener('pageshow', refreshResponsiveMenus, { passive: true });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', refreshResponsiveMenus, { passive: true });
        }
    </script>

    <script>
        /* ==================== SPEEDOMETER HUD ==================== */
        (function () {
            'use strict';

            const layer = document.getElementById('speedo-layer');
            if (!layer) return;

            const STORAGE_KEY = 'radial-speedometer-settings';
            const DEFAULTS = { style: 'twopod', position: 'bottom-right', dx: 0, dy: 0, scale: 1 };
            const POSITIONS = ['top-left', 'top-center', 'top-right', 'middle-left', 'middle-center', 'middle-right', 'bottom-left', 'bottom-center', 'bottom-right'];
            let cfg = Object.assign({}, DEFAULTS);

            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const saved = JSON.parse(raw);
                    if (saved && typeof saved === 'object') {
                        if (['twopod', 'onepod', 'off'].includes(saved.style)) cfg.style = saved.style;
                        if (POSITIONS.includes(saved.position)) cfg.position = saved.position;
                        cfg.dx = Number(saved.dx) || 0;
                        cfg.dy = Number(saved.dy) || 0;
                        cfg.scale = Math.min(Math.max(Number(saved.scale) || 1, .6), 1.4);
                    }
                }
            } catch (error) {
                console.info('[Speedometer] Penyimpanan lokal tidak tersedia, memakai setelan default.');
            }

            const state = {
                speed: 0, rpm: 800, gear: 'P', fuel: 85, health: 100,
                engine: false, lights: false, seatbelt: false, locked: false,
                handbrake: true, signalLeft: false, signalRight: false
            };
            const MAX_SPEED = 300;
            const MAX_RPM = 8000;
            const TP_C = { circ: 502.65, active: 335.10 };
            const OP_C = { speed: 911.1, rpm: 810.5, aux: 1017.9 };
            const $ = id => document.getElementById(id);
            const clamp = (value, min, max) => Math.min(Math.max(Number(value) || 0, min), max);
            const setStatus = (node, on, warn = false) => {
                if (node) node.className = 'status-icon' + (warn ? ' warn' : on ? ' on' : '');
            };

            /* ---------- Referensi elemen Two-Pod ---------- */
            const tp = {
                housing: $('tp-housingBezel'),
                speed: $('tp-speedValue'), speedArc: $('tp-speedArc'),
                rpm: $('tp-rpmValue'), rpmArc: $('tp-rpmArc'), gear: $('tp-gearValue'),
                needleSpeed: $('tp-needleSpeed'), needleRpm: $('tp-needleRpm'),
                healthFill: $('tp-healthFill'), healthText: $('tp-healthText'),
                fuelFill: $('tp-fuelFill'), fuelText: $('tp-fuelText'),
                healthBadge: $('tp-healthBadge'), fuelBadge: $('tp-fuelBadge'), shiftBar: $('tp-shiftBar'),
                engine: $('tp-iconEngine'), lights: $('tp-iconLights'), belt: $('tp-iconSeatbelt'),
                lock: $('tp-iconLock'), brake: $('tp-iconHandbrake'),
                left: $('tp-signalLeft'), right: $('tp-signalRight')
            };

            /* ---------- Referensi elemen One-Pod ---------- */
            const op = {
                housing: $('op-housingBezel'),
                speed: $('op-speedValue'), speedArc: $('op-speedArc'),
                rpm: $('op-rpmValue'), rpmArc: $('op-rpmArc'), gear: $('op-gearDisplay'),
                needle: $('op-needleGroup'),
                healthArc: $('op-healthArc'), healthText: $('op-healthText'),
                fuelArc: $('op-fuelArc'), fuelText: $('op-fuelText'),
                healthBadge: $('op-healthBadge'), fuelBadge: $('op-fuelBadge'),
                engine: $('op-iconEngine'), lights: $('op-iconLights'), belt: $('op-iconSeatbelt'),
                lock: $('op-iconLock'), brake: $('op-iconHandbrake'),
                left: $('op-signalLeft'), right: $('op-signalRight')
            };

            /* ---------- Skala Two-Pod ---------- */
            const shiftLeds = [];
            if (tp.shiftBar) {
                for (let i = 0; i < 9; i++) {
                    const led = document.createElement('div');
                    led.className = 'shift-led';
                    tp.shiftBar.appendChild(led);
                    shiftLeds.push(led);
                }
            }

            function buildTicks(container, cx, cy, rOut, count, redFrom, labelEvery, labelStep) {
                if (!container) return;
                const svgNS = 'http://www.w3.org/2000/svg';
                for (let i = 0; i <= count; i++) {
                    const angle = (-210 + i * (240 / count)) * Math.PI / 180;
                    const major = i % 2 === 0;
                    const rIn = major ? rOut - 9 : rOut - 5;
                    const line = document.createElementNS(svgNS, 'line');
                    line.setAttribute('class', 'tick');
                    line.setAttribute('x1', (cx + Math.cos(angle) * rIn).toFixed(2));
                    line.setAttribute('y1', (cy + Math.sin(angle) * rIn).toFixed(2));
                    line.setAttribute('x2', (cx + Math.cos(angle) * rOut).toFixed(2));
                    line.setAttribute('y2', (cy + Math.sin(angle) * rOut).toFixed(2));
                    line.setAttribute('stroke', i >= redFrom ? '#ff405b' : (major ? '#ffffff' : '#6f7480'));
                    line.setAttribute('stroke-width', major ? 2.3 : 1.2);
                    line.setAttribute('opacity', major ? '1' : '.8');
                    container.appendChild(line);

                    if (major && i % labelEvery === 0) {
                        const rTxt = rOut - 21;
                        const text = document.createElementNS(svgNS, 'text');
                        text.setAttribute('class', 'scale-num' + (i >= redFrom ? ' red' : ''));
                        text.setAttribute('x', (cx + Math.cos(angle) * rTxt).toFixed(2));
                        text.setAttribute('y', (cy + Math.sin(angle) * rTxt + 3.4).toFixed(2));
                        text.textContent = Math.round((i / count) * labelStep);
                        container.appendChild(text);
                    }
                }
            }

            buildTicks($('tp-ticksSpeed'), 128, 126, 70, 12, 10, 2, 300);
            buildTicks($('tp-ticksRpm'), 352, 126, 70, 16, 13, 2, 8);

            /* ---------- Skala One-Pod ---------- */
            (function buildOnePodTicks() {
                const container = $('op-ticks');
                if (!container) return;
                const svgNS = 'http://www.w3.org/2000/svg';
                for (let i = 0; i <= 12; i++) {
                    const angle = (-122 + i * (244 / 12)) * Math.PI / 180;
                    const major = i % 2 === 0;
                    const r1 = major ? 135 : 139;
                    const r2 = 145;
                    const line = document.createElementNS(svgNS, 'line');
                    line.setAttribute('x1', 175 + Math.cos(angle) * r1);
                    line.setAttribute('y1', 175 + Math.sin(angle) * r1);
                    line.setAttribute('x2', 175 + Math.cos(angle) * r2);
                    line.setAttribute('y2', 175 + Math.sin(angle) * r2);
                    line.setAttribute('stroke', i >= 10 ? '#ff405b' : (major ? '#ffffff' : '#7d808a'));
                    line.setAttribute('stroke-width', major ? 2.6 : 1.4);
                    line.setAttribute('stroke-linecap', 'round');
                    container.appendChild(line);
                }
            })();

            /* ---------- Render ---------- */
            function renderTwoPod() {
                const speed = clamp(state.speed, 0, MAX_SPEED);
                const rpm = clamp(state.rpm, 0, MAX_RPM);
                const fuel = clamp(state.fuel, 0, 100);
                const health = clamp(state.health, 0, 100);

                if (tp.speed) tp.speed.textContent = Math.round(speed);
                if (tp.speedArc) tp.speedArc.style.strokeDashoffset = TP_C.circ - (speed / MAX_SPEED * TP_C.active);
                if (tp.needleSpeed) tp.needleSpeed.style.transform = `rotate(${-120 + (speed / MAX_SPEED * 240)}deg)`;

                if (tp.rpm) tp.rpm.textContent = Math.round(rpm);
                if (tp.rpmArc) tp.rpmArc.style.strokeDashoffset = TP_C.circ - (rpm / MAX_RPM * TP_C.active);
                if (tp.needleRpm) tp.needleRpm.style.transform = `rotate(${-120 + (rpm / MAX_RPM * 240)}deg)`;
                if (tp.housing) tp.housing.classList.toggle('shift-halo', rpm >= 7000);

                const activeLeds = rpm > 4500 ? Math.round(((rpm - 4500) / (MAX_RPM - 4500)) * shiftLeds.length) : 0;
                shiftLeds.forEach((led, index) => {
                    led.className = index < activeLeds ? 'shift-led on ' + (index < 5 ? 'w' : 'r') : 'shift-led';
                });

                if (state.engine) {
                    if (state.handbrake && speed === 0) state.gear = 'P';
                    else if (state.gear !== 'R' && state.gear !== 'N') state.gear = speed < 35 ? '1' : speed < 70 ? '2' : speed < 120 ? '3' : speed < 170 ? '4' : speed < 230 ? '5' : '6';
                } else state.gear = 'P';
                if (tp.gear) tp.gear.textContent = String(state.gear ?? 'P').slice(0, 3);

                if (tp.healthText) tp.healthText.textContent = Math.round(health) + '%';
                if (tp.healthFill) tp.healthFill.style.width = health + '%';
                if (tp.healthBadge) tp.healthBadge.classList.toggle('low', health <= 30);

                if (tp.fuelText) tp.fuelText.textContent = Math.round(fuel) + '%';
                if (tp.fuelFill) tp.fuelFill.style.width = fuel + '%';
                if (tp.fuelBadge) tp.fuelBadge.classList.toggle('low', fuel <= 15);

                setStatus(tp.engine, state.engine);
                setStatus(tp.lights, state.lights);
                setStatus(tp.belt, state.seatbelt, !state.seatbelt);
                setStatus(tp.lock, state.locked);
                setStatus(tp.brake, state.handbrake, state.handbrake);
                if (tp.left) tp.left.classList.toggle('signal-active', !!state.signalLeft);
                if (tp.right) tp.right.classList.toggle('signal-active', !!state.signalRight);
            }

            function renderOnePod() {
                const speed = clamp(state.speed, 0, MAX_SPEED);
                const rpm = clamp(state.rpm, 0, MAX_RPM);
                const fuel = clamp(state.fuel, 0, 100);
                const health = clamp(state.health, 0, 100);

                if (op.speed) op.speed.textContent = Math.round(speed);
                if (op.speedArc) op.speedArc.style.strokeDashoffset = OP_C.speed - (speed / MAX_SPEED * 620);
                if (op.needle) op.needle.style.transform = `rotate(${-122 + (speed / MAX_SPEED * 244)}deg)`;

                if (op.rpm) op.rpm.textContent = Math.round(rpm);
                if (op.rpmArc) op.rpmArc.style.strokeDashoffset = OP_C.rpm - (rpm / MAX_RPM * 551);
                if (op.housing) op.housing.classList.toggle('shift-halo', rpm >= 7000);

                if (state.engine) {
                    if (state.handbrake && speed === 0) state.gear = 'P';
                    else if (state.gear !== 'R' && state.gear !== 'N') state.gear = speed < 35 ? '1' : speed < 70 ? '2' : speed < 120 ? '3' : speed < 170 ? '4' : speed < 230 ? '5' : '6';
                } else state.gear = 'P';
                if (op.gear) op.gear.textContent = String(state.gear ?? 'P').slice(0, 3);

                if (op.healthText) op.healthText.textContent = Math.round(health) + '%';
                if (op.healthArc) op.healthArc.style.strokeDashoffset = OP_C.aux - (health / 100 * 104);
                if (op.healthBadge) op.healthBadge.classList.toggle('low', health <= 30);

                if (op.fuelText) op.fuelText.textContent = Math.round(fuel) + '%';
                if (op.fuelArc) op.fuelArc.style.strokeDashoffset = OP_C.aux - (fuel / 100 * 104);
                if (op.fuelBadge) op.fuelBadge.classList.toggle('low', fuel <= 15);

                setStatus(op.engine, state.engine);
                setStatus(op.lights, state.lights);
                setStatus(op.belt, state.seatbelt, !state.seatbelt);
                setStatus(op.lock, state.locked);
                setStatus(op.brake, state.handbrake, state.handbrake);
                if (op.left) op.left.classList.toggle('signal-active', !!state.signalLeft);
                if (op.right) op.right.classList.toggle('signal-active', !!state.signalRight);
            }

            function renderSpeedometer() {
                renderTwoPod();
                renderOnePod();
            }

            window.updateSpeedometer = function (data) {
                if (!data || typeof data !== 'object') return;
                const allowed = ['speed', 'rpm', 'gear', 'fuel', 'health', 'engine', 'lights', 'seatbelt', 'locked', 'handbrake', 'signalLeft', 'signalRight'];
                for (const key of allowed) {
                    if (Object.prototype.hasOwnProperty.call(data, key)) state[key] = data[key];
                }
                renderSpeedometer();
            };

            /* ---------- Setelan & posisi ---------- */
            function activeVariant() {
                return cfg.style === 'onepod' ? $('speedo-onepod') : $('speedo-twopod');
            }

            function applyOffset() {
                layer.style.setProperty('--sp-dx', cfg.dx + 'px');
                layer.style.setProperty('--sp-dy', cfg.dy + 'px');
                layer.style.setProperty('--sp-scale', cfg.scale);
            }

            function clampOffset() {
                if (cfg.style === 'off') return;
                const element = activeVariant();
                if (!element) return;
                const pad = 8;
                for (let pass = 0; pass < 3; pass++) {
                    const rect = element.getBoundingClientRect();
                    let adjustX = 0;
                    let adjustY = 0;
                    if (rect.left < pad) adjustX = pad - rect.left;
                    else if (rect.right > window.innerWidth - pad) adjustX = (window.innerWidth - pad) - rect.right;
                    if (rect.top < pad) adjustY = pad - rect.top;
                    else if (rect.bottom > window.innerHeight - pad) adjustY = (window.innerHeight - pad) - rect.bottom;
                    if (!adjustX && !adjustY) break;
                    cfg.dx = Math.round(cfg.dx + adjustX);
                    cfg.dy = Math.round(cfg.dy + adjustY);
                    applyOffset();
                }
            }

            let applyingRemoteSettings = false;

            function emitSettings() {
                if (applyingRemoteSettings) return;
                const payload = { style: cfg.style, position: cfg.position, scale: cfg.scale, dx: cfg.dx, dy: cfg.dy };
                try {
                    if (typeof emitClientEvent === 'function') {
                        emitClientEvent('setSpeedometerSettings', JSON.stringify(payload));
                    }
                } catch (error) {
                    console.info('[Speedometer] Bridge belum tersedia.');
                }
                window.dispatchEvent(new CustomEvent('speedometerSettingsChanged', { detail: payload }));
            }

            function saveSettings() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
                } catch (error) { /* diabaikan */ }
                emitSettings();
            }

            function applySettings() {
                layer.dataset.pos = cfg.position;
                layer.classList.toggle('sp-off', cfg.style === 'off');
                $('speedo-twopod').classList.toggle('is-active', cfg.style === 'twopod');
                $('speedo-onepod').classList.toggle('is-active', cfg.style === 'onepod');
                applyOffset();
                if (cfg.style !== 'off') clampOffset();
                updateSettingsUI();
            }

            function updateSettingsUI() {
                ['twopod', 'onepod', 'off'].forEach(style => {
                    const chip = $('opt-speedo-' + style);
                    if (chip) chip.classList.toggle('active', cfg.style === style);
                });
                document.querySelectorAll('.spu-pos').forEach(button => {
                    button.classList.toggle('active', button.dataset.pos === cfg.position);
                const sizeInput = speedo-size;
                const sizeValue = speedo-size-value;
                if (sizeInput) sizeInput.value = Math.round(cfg.scale * 100);
                if (sizeValue) sizeValue.textContent = Math.round(cfg.scale * 100) + '%';
                });
                const dragButton = $('btn-speedo-drag');
                if (dragButton) {
                    const dragging = layer.classList.contains('is-dragging');
                    dragButton.textContent = dragging ? 'SELESAI' : 'GESER';
                    dragButton.classList.toggle('off', !dragging);
                    dragButton.disabled = cfg.style === 'off';
                }
            }

            window.applySpeedometerSettings = function (data) {
                if (!data || typeof data !== 'object') return;
                applyingRemoteSettings = true;
                try {
                    if (['twopod', 'onepod', 'off'].includes(data.style)) cfg.style = data.style;
                    if (POSITIONS.includes(data.position)) cfg.position = data.position;
                    if (Number.isFinite(Number(data.scale))) cfg.scale = Math.min(Math.max(Number(data.scale), .6), 1.4);
                    if (Number.isFinite(Number(data.dx))) cfg.dx = Number(data.dx);
                    if (Number.isFinite(Number(data.dy))) cfg.dy = Number(data.dy);
                    if (cfg.style === 'off') layer.classList.remove('is-dragging');
                    applySettings();
                    renderSpeedometer();
                } finally {
                    applyingRemoteSettings = false;
                }
            };
            window.setSpeedoScale = function (scale) {
                const next = Number(scale);
                if (!Number.isFinite(next)) return;
                cfg.scale = Math.min(Math.max(next, .6), 1.4);
                applySettings();
                renderSpeedometer();
                saveSettings();
            };
            window.setSpeedoStyle = function (style) {
                if (!['twopod', 'onepod', 'off'].includes(style)) return;
                cfg.style = style;
                if (style === 'off') layer.classList.remove('is-dragging');
                applySettings();
                renderSpeedometer();
                saveSettings();
            };

            window.setSpeedoPosition = function (position) {
                if (!POSITIONS.includes(position)) return;
                cfg.position = position;
                cfg.dx = 0;
                cfg.dy = 0;
                applySettings();
                saveSettings();
            };

            window.toggleSpeedoDrag = function () {
                if (cfg.style === 'off') return;
                const dragging = !layer.classList.contains('is-dragging');
                layer.classList.toggle('is-dragging', dragging);
                layer.classList.toggle('speedo-settings-preview', dragging);
                updateSettingsUI();
            };

            window.resetSpeedoOffset = function () {
                cfg.dx = 0;
                cfg.dy = 0;
                applySettings();
                saveSettings();
            };

            /* ---------- Geser bebas (drag) ---------- */
            let drag = null;

            layer.addEventListener('pointerdown', event => {
                if (!layer.classList.contains('is-dragging')) return;
                const element = activeVariant();
                if (!element || !element.contains(event.target)) return;
                drag = { id: event.pointerId, startX: event.clientX, startY: event.clientY, baseX: cfg.dx, baseY: cfg.dy };
                try { element.setPointerCapture(event.pointerId); } catch (error) { /* diabaikan */ }
                event.preventDefault();
            });

            layer.addEventListener('pointermove', event => {
                if (!drag || drag.id !== event.pointerId) return;
                cfg.dx = Math.round(drag.baseX + (event.clientX - drag.startX));
                cfg.dy = Math.round(drag.baseY + (event.clientY - drag.startY));
                applyOffset();
                event.preventDefault();
            });

            function endDrag(event) {
                if (!drag || drag.id !== event.pointerId) return;
                drag = null;
                clampOffset();
                saveSettings();
            }
            layer.addEventListener('pointerup', endDrag);
            layer.addEventListener('pointercancel', endDrag);

            /* ---------- Pratinjau data kendaraan ---------- */
            const previewEnabled = new URLSearchParams(location.search).get('preview') !== '0';
            if (previewEnabled) {
                window.addEventListener('keydown', event => {
                    const key = event.key.toLowerCase();
                    if (key === 'arrowup') {
                        state.engine = true;
                        state.handbrake = false;
                        state.speed = clamp(state.speed + 4, 0, MAX_SPEED);
                        state.rpm = clamp(1200 + (state.speed % 50) * 150, 0, MAX_RPM);
                    } else if (key === 'arrowdown') {
                        state.speed = clamp(state.speed - 6, 0, MAX_SPEED);
                        state.rpm = clamp(state.rpm - 200, 800, MAX_RPM);
                    } else if (key === 'e') state.engine = !state.engine;
                    else if (key === 'l') state.lights = !state.lights;
                    else if (key === 'b') state.seatbelt = !state.seatbelt;
                    else if (key === 'k') state.locked = !state.locked;
                    else if (key === 'h') state.handbrake = !state.handbrake;
                    else if (key === 'arrowleft') { state.signalLeft = !state.signalLeft; state.signalRight = false; }
                    else if (key === 'arrowright') { state.signalRight = !state.signalRight; state.signalLeft = false; }
                    else return;
                    renderSpeedometer();
                });
            }

            window.addEventListener('resize', () => clampOffset(), { passive: true });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => clampOffset(), { passive: true });
            }

            applySettings();
            renderSpeedometer();
        })();
    </script>
    <script>
        (function () {
            function parsePayload(payload) {
                if (typeof payload === 'string') { try { return JSON.parse(payload); } catch (e) { return null; } }
                return payload && typeof payload === 'object' ? payload : null;
            }
            function onSpeedometerUpdate(payload) {
                const data = parsePayload(payload);
                if (data && typeof window.updateSpeedometer === 'function') window.updateSpeedometer(data);
            }
            if (window.cef && typeof window.cef.on === 'function') {
                try { window.cef.on('speedometer_update', onSpeedometerUpdate); } catch (e) { console.warn('[Speedometer] cef listener unavailable', e); }
            }
            window.addEventListener('speedometer_update', event => onSpeedometerUpdate(event.detail));
        })();
    </script>    <script>
        (function () {
            function applyRemoteSpeedometerSettings(payload) {
                let data = payload;
                if (typeof data === 'string') {
                    try { data = JSON.parse(data); } catch (error) { return; }
                }
                if (!data || typeof data !== 'object') return;
                if (typeof window.setSpeedoStyle === 'function' && ['twopod', 'onepod', 'off'].includes(data.style)) window.setSpeedoStyle(data.style);
                if (typeof window.setSpeedoPosition === 'function' && typeof data.position === 'string') window.setSpeedoPosition(data.position);
                if (typeof window.resetSpeedoOffset === 'function' && (data.dx !== undefined || data.dy !== undefined)) window.resetSpeedoOffset();
            }
            if (window.cef && typeof window.cef.on === 'function') {
                try { window.cef.on('speedometer_settings', applyRemoteSpeedometerSettings); } catch (error) { console.warn('[Speedometer] settings listener unavailable', error); }
            }
            window.addEventListener('speedometer_settings', event => applyRemoteSpeedometerSettings(event.detail));
        })();
    </script></body>
</html>
